[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.35"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50

[rpc_endpoints]
# *.chain.robinhood.com is blocked on this network -> publicnode
mainnet = "https://robinhood-rpc.publicnode.com"
mainnet_archive = "https://robinhood.drpc.org"
testnet = "https://robinhood-sepolia-rpc.publicnode.com"

[lint]
lint_on_build = false
